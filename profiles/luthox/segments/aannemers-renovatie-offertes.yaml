segment:
  slug: aannemers-renovatie-offertes
  name: Aannemers, renovatie- en dakdekkersbedrijven — offertes maken (belonderzoek)
  description: >
    Cold-call segmenttest (±10 onderzoeksgesprekken). Beperkt de
    industrie-agnostische basis-ICP tot aannemers voor verbouw/renovatie,
    dakdekkersbedrijven en badkamer-/keukenrenovatiebedrijven. Het probleem:
    de eigenaar of werkvoorbereider doet overdag opnames bij klanten en
    zit 's avonds 1–3 uur per offerte notities en foto's om te zetten naar
    een gespecificeerde offerte. De oplossing: spraakmemo en foto's van de
    opname -> transcriptie -> AI maakt een conceptofferte op basis van de
    eigen prijslijst en het eigen sjabloon -> controleren en versturen. De
    eerste insteek is een onderzoeksgesprek, geen intake; de openingsvraag
    is: "Hoe lang duurt het om van een opname bij de klant naar een
    verstuurde offerte te komen?"
  base_profile: profiles/luthox/client-profile.yaml
  created_at: 2026-09-28

icp_hard_filters:
  industries_in:
    set:
      - Aannemers verbouw en renovatie (particulier en zakelijk)
      - Dakdekkersbedrijven
      - Badkamer- en keukenrenovatie
  headcount_min: 5
  headcount_max: 75
  job_titles:
    - Directeur-eigenaar
    - Werkvoorbereider
    - Calculator
    - Projectleider
  qualitative_disqualifiers:
    - Alleen grote nieuwbouwprojecten/aanbestedingen (offertes via calculatieafdeling, geen opnames bij particulieren)
    - Eenmanszaak of zzp'er zonder personeel
    - Alleen winkel/showroomverkoop zonder opname op locatie

icp_soft_preferences:
  triggers:
    - veel_offerteaanvragen_particulier   # "vraag gratis offerte aan"/"gratis opname" prominent op de site
    - job_postings_for_werkvoorbereider_or_calculator
    - hoge_reviewvolumes                  # veel reviews (Werkspot, Trustoo, Google) -> veel aanvragen
  partial_competitor_overlap_note: >
    Gebruikt het bedrijf al calculatie-/offertesoftware (bijv. Bouwsoft,
    Snelstart, Gripp, Ibis, Kubus)? Geen uitsluiting: de tijd zit juist in
    het omzetten van de opname naar de invoer. Noteer het als aandachtspunt.
  personas_to_prioritize:
    set:
      - Directeur-eigenaar
      - Werkvoorbereider / calculator
