lessen:
  - Indeed werkt zonder login met EENVOUDIGE zoektermen; samengestelde zoekopdrachten met OR/min-tekens triggeren een Cloudflare-controle (die ik niet omzeil).
  - Van ~60 gelezen vacatures bleven 1 sterke en 1 onbekende kandidaat over; de rest was te groot, IT/consultancy of PLC.
  - Zoekresultaten ranken grote werkgevers hoog; de MKB-vacatures zitten verspreid en moeten per stuk worden geopend.
